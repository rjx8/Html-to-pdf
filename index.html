<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محول HTML إلى PDF</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: #2c3e50;
            color: white;
            padding: 25px 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            color: #bdc3c7;
            font-size: 16px;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 30px;
            background: #f8f9fa;
        }

        .input-section, .preview-section {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .section-title {
            font-size: 18px;
            color: #2c3e50;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e0e0e0;
        }

        .html-input {
            width: 100%;
            height: 400px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            resize: vertical;
            direction: ltr;
        }

        .html-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .preview-box {
            min-height: 400px;
            max-height: 500px;
            overflow: auto;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            background: white;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            flex: 1;
            min-width: 150px;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5a67d8;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-success {
            background: #48bb78;
            color: white;
        }

        .btn-success:hover {
            background: #38a169;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(72, 187, 120, 0.4);
        }

        .btn-secondary {
            background: #a0aec0;
            color: white;
        }

        .btn-secondary:hover {
            background: #718096;
        }

        .progress-bar {
            margin-top: 20px;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            display: none;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s ease;
        }

        .status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            display: none;
        }

        .status.success {
            background: #c6f6d5;
            color: #22543d;
            border: 1px solid #9ae6b4;
        }

        .status.error {
            background: #fed7d7;
            color: #742a2a;
            border: 1px solid #fc8181;
        }

        .status.info {
            background: #bee3f8;
            color: #2c5282;
            border: 1px solid #90cdf4;
        }

        .hidden-container {
            position: absolute;
            left: -9999px;
            top: -9999px;
            width: 2480px;
            visibility: hidden;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📄 محول HTML إلى PDF</h1>
            <p>تحويل صفحات HTML إلى PDF بدقة عالية مع الحفاظ على التنسيقات والخطوط</p>
        </div>
        
        <div class="main-content">
            <div class="input-section">
                <div class="section-title">📝 كود HTML</div>
                <textarea id="htmlInput" class="html-input" placeholder="أدخل كود HTML هنا...">&lt;!DOCTYPE html&gt;

&lt;/head&gt;

        &lt;/div&gt;

            &lt;p&gt;You can add any HTML content here and it will be converted with high quality.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div class="footer"&gt;
            Page 2 of 3
        &lt;/div&gt;
    &lt;/div&gt;
    
    &lt;div class="page rtl"&gt;
        &lt;div class="header"&gt;
            &lt;h1&gt;الصفحة الثالثة&lt;/h1&gt;
        &lt;/div&gt;
        &lt;div class="content"&gt;
            &lt;p&gt;محتوى إضافي للصفحة الثالثة.&lt;/p&gt;
            &lt;img src="https://via.placeholder.com/400x200" alt="صورة تجريبية"&gt;
        &lt;/div&gt;
        &lt;div class="footer"&gt;
            صفحة 3 من 3
        &lt;/div&gt;
    &lt;/div&gt;
&lt;/body&gt;
&lt;/html&gt;</textarea>
                <div class="button-group">
                    <button id="previewBtn" class="btn btn-primary">👁️ معاينة</button>
                    <button id="convertBtn" class="btn btn-success">🔄 تحويل إلى PDF</button>
                    <button id="clearBtn" class="btn btn-secondary">🗑️ مسح</button>
                </div>
            </div>
            
            <div class="preview-section">
                <div class="section-title">👁️ معاينة سريعة</div>
                <div id="previewBox" class="preview-box">
                    <p style="color: #999; text-align: center;">انقر على "معاينة" لعرض المحتوى</p>
                </div>
            </div>
        </div>
        
        <div class="progress-bar" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        
        <div id="status" class="status"></div>
    </div>

    <div id="hiddenContainer" class="hidden-container"></div>

    <!-- تحميل المكتبات المطلوبة -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="converter.js"></script>
</body>
</html>
